[workspace]
members = [
    "escrow_factory",
    "escrow_source", 
    "escrow_destination"
]

[workspace.dependencies]
near-sdk = "5.0.0"
near-workspaces = "0.8.0"
tokio = "1.0"
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
near-workspaces = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
hex = { workspace = true }