[package]
name = "escrow_destination"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.0.0", features = ["legacy", "unit-testing"] }
hex = "0.4"
serde_json = "1.0"
borsh = "1.0.0"
schemars = "0.8"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
